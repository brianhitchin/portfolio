<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Hero section</title>
<style>
  :root {
    --background: #f6f2e9;
    --foreground: #18150f;
    --muted: #6b6355;
    --accent: #b3391a;
    --font-serif: Georgia, "Iowan Old Style", Palatino, serif;
    --font-mono: ui-monospace, "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--background); color: var(--foreground); font-family: var(--font-serif); }
  section { padding: 96px 48px; min-height: 420px; display: flex; flex-direction: column; justify-content: center; }
  .pill { display: inline-flex; align-items: center; gap: 8px; width: fit-content; font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--accent); margin-bottom: 28px; }
  .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--accent); }
  h1 { font-size: 48px; font-weight: 400; line-height: 1.1; margin: 0 0 24px; max-width: 680px; }
  h1 em { color: var(--accent); font-style: italic; }
  p.sub { font-family: var(--font-mono); font-size: 13px; color: var(--muted); max-width: 460px; line-height: 1.7; margin: 0 0 32px; }
  .actions { display: flex; gap: 14px; }
  .btn-primary { background: var(--foreground); color: var(--background); padding: 13px 24px; font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; }
  .btn-secondary { border: 1px solid var(--foreground); padding: 12px 24px; font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; }
</style>
</head>
<body>
  <section>
    <span class="pill"><span class="dot"></span> Open to new opportunities</span>
    <p style="font-family: var(--font-mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 28px;">Full-Stack Engineer · Seattle, WA</p>
    <h1>I build platforms where <em>applied AI</em> meets careful backend engineering.</h1>
    <p class="sub">React, Java/Spring, and cloud systems serving thousands of internal users — with the operational overhead designed out of them.</p>
    <div class="actions">
      <span class="btn-primary">View the work</span>
      <span class="btn-secondary">Get in touch</span>
    </div>
  </section>
</body>
</html>
