<!-- @dsCard group="Type" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Typography</title>
<style>
  :root {
    --background: #f6f2e9;
    --foreground: #18150f;
    --muted: #6b6355;
    --border: rgba(24, 21, 15, 0.14);
    --accent: #b3391a;
    --font-serif: Georgia, "Iowan Old Style", Palatino, serif;
    --font-mono: ui-monospace, "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--background); color: var(--foreground); font-family: var(--font-serif); padding: 32px; }
  .row { padding: 20px 0; border-bottom: 1px solid var(--border); display: flex; align-items: baseline; gap: 24px; }
  .row:last-child { border-bottom: none; }
  .tag { font-family: var(--font-mono); font-size: 11px; color: var(--muted); width: 90px; flex-shrink: 0; text-transform: uppercase; letter-spacing: 0.06em; }
  h1.sample { font-size: 48px; font-weight: 400; letter-spacing: -0.01em; margin: 0; line-height: 1.1; }
  h1.sample em { color: var(--accent); font-style: italic; }
  h2.sample { font-size: 32px; font-weight: 400; margin: 0; }
  p.sample { font-family: var(--font-mono); font-size: 13px; color: var(--muted); margin: 0; max-width: 520px; line-height: 1.7; }
  span.label { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--accent); }
</style>
</head>
<body>
  <div class="row"><span class="tag">Display / H1</span><h1 class="sample">Platforms where <em>applied AI</em> meets careful engineering</h1></div>
  <div class="row"><span class="tag">Heading / H2</span><h2 class="sample">Selected work</h2></div>
  <div class="row"><span class="tag">Body / Mono</span><p class="sample">Body copy set in the monospace stack at 13px over a muted foreground for secondary emphasis against the warm paper background.</p></div>
  <div class="row"><span class="tag">Eyebrow</span><span class="label">Section label</span></div>
</body>
</html>
